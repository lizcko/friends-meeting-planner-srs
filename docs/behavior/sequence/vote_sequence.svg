.5859,288.5,554.5859" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="286.5" x2="589.5" y1="554.5859" y2="554.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="201" x="298.5" y="549.52">renderMeetings(), countVotes()</text><polygon fill="#A80036" points="80.5,579.7188,70.5,583.7188,80.5,587.7188,76.5,583.7188" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="74.5" x2="280.5" y1="583.7188" y2="583.7188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="178" x="86.5" y="578.6528">Обновлённые результаты</text><!--MD5=[5dfdfad885f7e6a732ae4068dc6592f4]
@startuml
title Голосование за дату
actor Участник as U
participant "Интерфейс" as UI
participant "script.js" as JS
database localStorage as DB
U -> UI: Выбрать участника и даты
UI -> JS: saveVote(meetingId, participant, selectedIds)
activate JS
alt Участник не входит во встречу
 JS - -> U: Сначала выберите участника
else Участник найден
 JS -> JS: Отфильтровать ID дат, убрать дубликаты
 JS -> JS: Заменить votes[participant]
 JS -> DB: setItem(meetings)
 alt Успех
 DB - -> JS: OK
 JS - -> U: Голос успешно сохранён
 else Ошибка
 DB - -> JS: Исключение
 JS - -> U: Не удалось сохранить изменения
 end
 JS -> UI: renderMeetings(), countVotes()
 UI - -> U: Обновлённые результаты
end
deactivate JS
@enduml

