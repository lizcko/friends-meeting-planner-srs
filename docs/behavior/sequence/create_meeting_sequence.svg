ingAndGlyphs" textLength="161" x="310" y="549.52">renderMeetings(), reset()</text><polygon fill="#A80036" points="95,579.7188,85,583.7188,95,587.7188,91,583.7188" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="89" x2="292" y1="583.7188" y2="583.7188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="126" x="101" y="578.6528">Карточка встречи</text><!--MD5=[86f503bd90e9c9dd78eed75c266e59a9]
@startuml
title Создание встречи
actor Организатор as U
participant "Интерфейс" as UI
participant "script.js" as JS
database localStorage as DB
U -> UI: Название, описание, место
UI -> JS: submit
activate JS
JS -> JS: trim(), проверка названия
alt Название пустое
 JS - -> UI: Ошибка валидации
 UI - -> U: Укажите название
else Данные корректны
 JS -> JS: Создать объект встречи и UUID
 JS -> DB: setItem(JSON.stringify(meetings))
 alt Сохранение успешно
 DB - -> JS: OK
 else Ошибка хранения
 DB - -> JS: Исключение
 JS - -> U: Не удалось сохранить изменения
 end
 JS -> UI: renderMeetings(), reset()
 UI - -> U: Карточка встречи
end
deactivate JS
@enduml

